- defaults:
    link:
      create: true
      force: true
      relink: true

- link:
    ~/.dotfiles: ''
    ~/.bash:
    ~/.bash_profile:
    ~/.bashrc:
    ~/.gitignore_global:
    ~/.inputrc:
    ~/.tmux.conf:
    ~/.vim:
    ~/.vimrc:
    ~/.zshrc:
    ~/.zsh:
    ~/bin/:
      glob: true
      path: bin/*
